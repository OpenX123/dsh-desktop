name: 发布 / Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建的已有版本 tag，例如 v0.1.0 / Existing release tag"
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: 校验版本与源码 / Validate version and source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: 检出 tag / Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: 安装 pnpm / Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - name: 安装 Node.js / Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: 校验 tag 并解析版本 / Validate tag and resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)*$ ]]; then
            echo "无效的版本 tag / Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG^{commit}" >/dev/null; then
            echo "该引用不是已有 tag / Release ref is not an existing tag: $RELEASE_TAG" >&2
            exit 1
          fi

          # 版本号以 tag 为准，构建时写入 package.json，不再要求源码提前同步。
          # The tag is the source of truth; builds write it into package.json.
          VERSION="${RELEASE_TAG#v}"
          PRERELEASE=false
          [[ "$VERSION" == *-* ]] && PRERELEASE=true
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: 安装依赖 / Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 类型检查 / Typecheck
        run: pnpm run typecheck

      - name: 代码检查 / Lint
        run: pnpm run lint

      - name: 构建主进程 / Build shell
        run: pnpm run build

  prepare-release:
    name: 创建草稿 Release / Create draft release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      IS_PRERELEASE: ${{ needs.validate.outputs.prerelease }}

    steps:
      - name: 按需创建草稿 Release / Create draft release if needed
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG 已存在，复用之 / already exists, reusing it"
            exit 0
          fi

          cat > release-notes.md <<'EOF'
          > **非官方项目 / Unofficial project:** 此桌面客户端由社区独立维护，并非 DeepSeek 官方产品，也不由 DeepSeek 背书或提供支持。This community desktop client is not an official DeepSeek product and is not endorsed or supported by DeepSeek.

          ## 下载说明

          本版本由 GitHub Actions 从对应 tag 自动构建，安装包内置固定版本的官方 `dsh` 运行时，无需另装 Node.js、pnpm 或 dsh CLI。当前安装包尚未进行代码签名，首次打开时操作系统可能显示安全提示。请使用 `SHA256SUMS.txt` 校验下载文件。

          ## Download notes

          This release was built automatically from the matching tag and bundles a pinned official `dsh` runtime, so Node.js, pnpm, and a separate dsh CLI are not required. Packages are currently unsigned, so the operating system may show a security warning on first launch. Use `SHA256SUMS.txt` to verify downloads.
          EOF

          FLAGS=(--draft --verify-tag --title "DeepSeek Harness Desktop $RELEASE_TAG" --notes-file release-notes.md)
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${FLAGS[@]}"

  build:
    name: 构建 ${{ matrix.name }} / Build ${{ matrix.name }}
    needs:
      - validate
      - prepare-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            id: macos-arm64
            os: macos-15
            command: pnpm exec electron-builder --mac dmg zip --arm64 --publish never
            smoke: pnpm run smoke:package
          - name: macOS Intel
            id: macos-x64
            os: macos-15-intel
            command: pnpm exec electron-builder --mac dmg zip --x64 --publish never
            smoke: pnpm run smoke:package
          - name: Windows x64
            id: windows-x64
            os: windows-latest
            command: pnpm exec electron-builder --win nsis zip --x64 --publish never
            smoke: pnpm run smoke:package
          - name: Linux x64
            id: linux-x64
            os: ubuntu-latest
            command: pnpm exec electron-builder --linux AppImage deb --x64 --publish never
            smoke: xvfb-run -a pnpm run smoke:package

    steps:
      - name: 检出 tag / Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: 安装 pnpm / Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - name: 安装 Node.js / Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: 写入发布版本号 / Write release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: npm pkg set "version=$RELEASE_VERSION"

      - name: 安装依赖 / Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 构建应用 / Build application
        run: pnpm run build

      - name: 准备内置 dsh 运行时 / Prepare bundled dsh runtime
        run: pnpm run prepare:runtime

      - name: 生成安装包 / Package application
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: 验证安装包内置运行时 / Smoke packaged runtime
        run: ${{ matrix.smoke }}

      - name: 验证 Windows NSIS 实际安装结果 / Smoke installed Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -Path release -File -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $installer) {
            throw 'NSIS installer not found under release/'
          }

          $installDir = Join-Path $env:RUNNER_TEMP ('dsh-desktop-nsis-' + [guid]::NewGuid().ToString('N'))
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "NSIS installer exited with code $($install.ExitCode)"
          }

          $executable = Join-Path $installDir 'DeepSeek Harness Desktop.exe'
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "Installed executable not found: $executable"
          }
          pnpm run smoke:package -- "$executable"
          if ($LASTEXITCODE -ne 0) {
            throw "Installed NSIS runtime smoke failed with code $LASTEXITCODE"
          }

      - name: 验证 Windows ZIP 解压结果 / Smoke extracted Windows ZIP runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Get-ChildItem -Path release -File -Filter '*.zip' | Select-Object -First 1
          if ($null -eq $archive) {
            throw 'Windows ZIP package not found under release/'
          }

          $extractDir = Join-Path $env:RUNNER_TEMP ('dsh-desktop-zip-' + [guid]::NewGuid().ToString('N'))
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $extractDir
          $executable = Get-ChildItem -Path $extractDir -Recurse -File -Filter 'DeepSeek Harness Desktop.exe' | Select-Object -First 1
          if ($null -eq $executable) {
            throw "Extracted executable not found under $extractDir"
          }
          pnpm run smoke:package -- "$($executable.FullName)"
          if ($LASTEXITCODE -ne 0) {
            throw "Extracted ZIP runtime smoke failed with code $LASTEXITCODE"
          }

      # Runs even when a smoke step failed: the packages are what a failure
      # has to be diagnosed from. A failed job still blocks the release,
      # because the publish job depends on this one succeeding.
      - name: 上传构建产物 / Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsh-desktop-${{ matrix.id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/*.yml
            !release/builder-debug.yml
            !release/builder-effective-config.yaml

      # 只有本平台全部冒烟测试通过后，安装包才会进入草稿 Release。
      # Packages reach the draft release only after every smoke check passed.
      - name: 上传安装包到草稿 Release / Upload packages to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(release/*.dmg release/*.zip release/*.exe release/*.AppImage release/*.deb release/*.blockmap)
          if (( ${#files[@]} == 0 )); then
            echo "release/ 下没有找到安装包 / No packages found under release/" >&2
            exit 1
          fi

          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber

  publish:
    name: 发布 GitHub Release / Publish GitHub Release
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      IS_PRERELEASE: ${{ needs.validate.outputs.prerelease }}

    steps:
      - name: 下载 Release 资产 / Download release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "$RELEASE_TAG" --dir assets --pattern '*' --clobber

      - name: 生成并上传 SHA-256 校验文件 / Generate and upload checksums
        shell: bash
        run: |
          set -euo pipefail
          cd assets
          rm -f SHA256SUMS.txt
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%P\0' \
            | sort -z \
            | xargs -0 -r sha256sum > SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt --clobber

      - name: 将草稿转为正式发布 / Publish completed release
        shell: bash
        run: |
          set -euo pipefail

          FLAGS=(--draft=false)
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            FLAGS+=(--prerelease)
          else
            FLAGS+=(--latest)
          fi
          gh release edit "$RELEASE_TAG" "${FLAGS[@]}"
