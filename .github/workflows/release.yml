name: 发布 / Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建的已有版本 tag，例如 v0.1.1 / Existing release tag"
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: 校验版本与源码 / Validate version and source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: 检出 tag / Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: 安装 pnpm / Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - name: 安装 Node.js / Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: 校验 tag 并解析版本 / Validate tag and resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)*$ ]]; then
            echo "无效的版本 tag / Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG^{commit}" >/dev/null; then
            echo "该引用不是已有 tag / Release ref is not an existing tag: $RELEASE_TAG" >&2
            exit 1
          fi

          # 版本号以 tag 为准，构建时写入 package.json，不再要求源码提前同步。
          # The tag is the source of truth; builds write it into package.json.
          VERSION="${RELEASE_TAG#v}"
          PRERELEASE=false
          [[ "$VERSION" == *-* ]] && PRERELEASE=true
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: 安装依赖 / Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 类型检查 / Typecheck
        run: pnpm run typecheck

      - name: 代码检查 / Lint
        run: pnpm run lint

      - name: 构建主进程 / Build shell
        run: pnpm run build

  prepare-release:
    name: 创建草稿 Release / Create draft release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      IS_PRERELEASE: ${{ needs.validate.outputs.prerelease }}

    steps:
      - name: 按需创建草稿 Release / Create draft release if needed
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG 已存在，复用之 / already exists, reusing it"
            exit 0
          fi

          cat > release-notes.md <<'EOF'
          > **非官方项目 / Unofficial project:** 此桌面客户端由社区独立维护，并非 DeepSeek 官方产品，也不由 DeepSeek 背书或提供支持。This community desktop client is not an official DeepSeek product and is not endorsed or supported by DeepSeek.

          ## 下载说明

          本版本由 GitHub Actions 从对应 tag 自动构建，安装包内置固定版本的官方 `dsh` 运行时，无需另装 Node.js、pnpm 或 dsh CLI。当前安装包尚未经过正式的开发者签名认证，首次打开时操作系统可能显示安全提示，按下方说明操作一次即可。

          **macOS**：把应用拖入「应用程序」并双击打开，系统会提示无法打开，此时打开「系统设置 → 隐私与安全性」，在「安全性」区域点击「仍要打开」，输入密码即可。极少数情况下如果提示应用已损坏且没有该按钮，可在「终端」中执行：

          ```sh
          xattr -dr com.apple.quarantine "/Applications/DeepSeek Harness Desktop.app"
          open "/Applications/DeepSeek Harness Desktop.app"
          ```

          **Windows**：如果 Microsoft Defender SmartScreen 弹出提示，点击「更多信息」，再点击「仍要运行」即可。

          ## Download notes

          This release was built automatically from the matching tag and bundles a pinned official `dsh` runtime, so Node.js, pnpm, and a separate dsh CLI are not required. Packages are not yet signed with a registered developer certificate, so the operating system may show a security prompt on first launch — follow the steps below once and you're set.

          **macOS**: Drag the app to **Applications** and double-click it. The system will say it can't be opened; go to **System Settings → Privacy & Security**, and in the Security section choose **Open Anyway**, then enter your password. In rare cases if it still says the app is damaged and that button isn't available, run this in Terminal:

          ```sh
          xattr -dr com.apple.quarantine "/Applications/DeepSeek Harness Desktop.app"
          open "/Applications/DeepSeek Harness Desktop.app"
          ```

          **Windows**: If Microsoft Defender SmartScreen shows a prompt, click **More info**, then **Run anyway**.
          EOF

          FLAGS=(--draft --verify-tag --title "DeepSeek Harness Desktop $RELEASE_TAG" --notes-file release-notes.md)
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${FLAGS[@]}"

  build:
    name: 构建 ${{ matrix.name }} / Build ${{ matrix.name }}
    needs:
      - validate
      - prepare-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            id: macos-arm64
            os: macos-15
            command: pnpm exec electron-builder --mac dmg --arm64 --publish never
            smoke: pnpm run smoke:package
          - name: macOS Intel
            id: macos-x64
            os: macos-15-intel
            command: pnpm exec electron-builder --mac dmg --x64 --publish never
            smoke: pnpm run smoke:package
          - name: Windows x64
            id: windows-x64
            os: windows-latest
            command: pnpm exec electron-builder --win nsis --x64 --publish never
            smoke: pnpm run smoke:package

    steps:
      - name: 检出 tag / Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: 安装 pnpm / Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - name: 安装 Node.js / Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: 写入发布版本号 / Write release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: npm pkg set "version=$RELEASE_VERSION"

      # The bundled runtime is tens of thousands of small files, written once by
      # the packager and again by the installer smoke. Real-time scanning of
      # every one of them dominates this job; excluding the two directories the
      # build owns is a runner-local change that never reaches an artifact.
      - name: 排除 Defender 实时扫描 / Exclude build paths from Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($path in @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP)) {
            try {
              Add-MpPreference -ExclusionPath $path -ErrorAction Stop
              Write-Host "excluded $path"
            } catch {
              # An unavailable Defender API is a lost optimisation, not a
              # release blocker: the build is correct either way.
              Write-Host "could not exclude ${path}: $($_.Exception.Message)"
            }
          }

      - name: 安装依赖 / Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 构建应用 / Build application
        run: pnpm run build

      - name: 准备内置 dsh 运行时 / Prepare bundled dsh runtime
        run: pnpm run prepare:runtime

      - name: 验证 Windows 目录选择器兼容补丁 / Verify Win32 picker compatibility patch
        run: pnpm run check:picker

      - name: 生成安装包 / Package application
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: 验证安装包内置运行时 / Smoke packaged runtime
        run: ${{ matrix.smoke }}

      - name: 验证 Windows NSIS 实际安装结果 / Smoke installed Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -Path release -File -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $installer) {
            throw 'NSIS installer not found under release/'
          }

          $installDir = Join-Path $env:RUNNER_TEMP ('dsh-desktop-nsis-' + [guid]::NewGuid().ToString('N'))
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "NSIS installer exited with code $($install.ExitCode)"
          }

          $executable = Join-Path $installDir 'DeepSeek Harness Desktop.exe'
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "Installed executable not found: $executable"
          }
          # Not `pnpm run smoke:package -- ...`: pnpm forwards the separator
          # itself, so the script would receive a literal `--` as its target.
          node scripts/smoke-package.mjs "$executable"
          if ($LASTEXITCODE -ne 0) {
            throw "Installed NSIS runtime smoke failed with code $LASTEXITCODE"
          }

      # 只有本平台全部冒烟测试通过后，安装包才会进入草稿 Release。
      # Packages reach the draft release only after every smoke check passed.
      - name: 上传安装包到草稿 Release / Upload packages to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(release/*.dmg release/*.exe)
          if (( ${#files[@]} == 0 )); then
            echo "release/ 下没有找到安装包 / No packages found under release/" >&2
            exit 1
          fi

          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber

      # Keep packages for diagnosis when any step above failed, including the
      # Release upload itself. Successful runs already have their only copy on
      # the draft Release and do not need a duplicate Actions artifact.
      - name: 上传失败构建产物 / Upload failed build artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dsh-desktop-${{ matrix.id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            release/*.dmg
            release/*.exe

  publish:
    name: 发布 GitHub Release / Publish GitHub Release
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      IS_PRERELEASE: ${{ needs.validate.outputs.prerelease }}

    steps:
      - name: 检出更新清单脚本 / Checkout update-feed script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
          sparse-checkout: scripts/write-update-feed.mjs

      - name: 下载 Release 资产 / Download release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "$RELEASE_TAG" --dir assets --pattern '*' --clobber

      - name: 生成并上传 SHA-256 校验文件 / Generate and upload checksums
        shell: bash
        run: |
          set -euo pipefail
          cd assets
          rm -f SHA256SUMS.txt latest.json
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt ! -name latest.json ! -name release-notes.md -printf '%P\0' \
            | sort -z \
            | xargs -0 -r sha256sum > SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt --clobber

      - name: 生成并上传在线更新清单 / Generate and upload update feed
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json body -q .body > assets/release-notes.md
          node scripts/write-update-feed.mjs \
            --dir assets \
            --version "$RELEASE_VERSION" \
            --repo "$GH_REPO" \
            --notes-file assets/release-notes.md \
            --out assets/latest.json
          gh release upload "$RELEASE_TAG" assets/latest.json --clobber

      - name: 将草稿转为正式发布 / Publish completed release
        shell: bash
        run: |
          set -euo pipefail

          FLAGS=(--draft=false)
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            FLAGS+=(--prerelease)
          else
            FLAGS+=(--latest)
          fi
          gh release edit "$RELEASE_TAG" "${FLAGS[@]}"
