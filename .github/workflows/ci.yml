name: 持续集成 / CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 检查并构建 / Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出源码 / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 安装 pnpm / Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - name: 安装 Node.js / Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖 / Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 校验客户端身份 / Verify client identity
        run: pnpm run check:identity

      - name: 类型检查 / Typecheck
        run: pnpm run typecheck

      - name: 代码检查 / Lint
        run: pnpm run lint

      - name: 构建 / Build
        run: pnpm run build
