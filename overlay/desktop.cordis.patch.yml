# Desktop client overlay over the base harness core.
#
# This patch is the desktop client's own composition layer — the client is an
# independent product, deliberately NOT the `dsh` web profile: it never mounts
# the web-app bundle, its client-plugin roster, or the web surface prompt.
# What it shares with other products is the harness core (base bundle) plus
# the transport seam (webserver / api-gateway / connection node half), which
# the GUI layering RFC reserves for every product client.

# The base mounts shared plugin HMR with a module-reload root; the desktop
# client has no module system to reload, so keep the row inert.
- id: hmr
  disabled: true

# The base exports session telemetry by default. An independent client does
# not phone home without the operator asking; re-enable via the
# DSH_TELEMETRY_OTLP_URL / DSH_TELEMETRY_DISABLED environment switches.
- id: telemetry-otel
  disabled: true

# The desktop GUI host plane: loopback HTTP carrier + the shared wire
# contract + the workspace registry. `desktopStartup` is provided by the
# desktop glue plugin, which reads the invocation's `--port` flag.
- insert:
    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      inject: [desktopStartup]
      config:
        host: '127.0.0.1'
        port: !!js ctx.desktopStartup.port ?? 3080

    # The API gateway: the transport-agnostic dispatch face every client
    # shape shares.
    - id: api-gateway
      name: '@deepseek-ai/dsh-host-apiproxy'

    # Wire consumer layer: the node half binds the gateway under /api and
    # owns the loopback trust fence; the browser half never loads in this
    # client (the renderer is an independent app, not a web plugin).
    - id: connection
      name: '@deepseek-ai/dsh-client-connection'

    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    - id: storage
      name: '@deepseek-ai/dsh-storage'

    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('storages')

    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json

    - id: message-feedback
      name: '@deepseek-ai/dsh-message-feedback'
      config:
        maxNoteBytes: 8192

    - id: session-projection-cache
      name: '@deepseek-ai/dsh-session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000

    # Resolve bind host and display once at boot, then mount the matching
    # dual-face directory picker (native OS chooser on this desktop).
    - id: directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-auto'

    # TypeRT Remote gateway: serves the goal and message-feedback domains
    # (the host-side interceptor the gateway's Remote methods dispatch to).
    - id: api-remotes
      name: '@deepseek-ai/dsh-api-remotes'

    # The agent-preset roster. The shipped presets live in the OFFICIAL
    # checkout's apps/cli/config/agent-presets (read-only, system trust); the
    # user's own live in the client's data home. `harnessRoot` comes from the
    # desktopStartup service, which resolves the official checkout path.
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      inject: [desktopStartup]
      config:
        default: standard
        roots:
          - path: !!js ctx.desktopStartup.harnessRoot + '/apps/cli/config/agent-presets'
            trust: system
          - path: !!js dshHomePath('.agent-presets')
            trust: user

# ── the agent plane moves behind agent presets ─────────────────────────────
#
# Every row below composes what ONE agent contributes to the host registries:
# its tools, its prompt sections, its delegation backends. The base keeps them
# for single-session surfaces; the desktop client mounts a preset per session
# instead, exactly like the official web profile. Disabling rather than
# deleting is deliberate: a row absent from a surface overlay would silently
# reappear the day someone reorders the composition.
- id: tool-bash
  disabled: true
- id: tool-tasks
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-str-replace-editor
  disabled: true
- id: skill-local
  disabled: true
- id: tool-skill
  disabled: true
- id: tool-goal
  disabled: true
- id: plan-mode
  disabled: true
- id: compact-basic
  disabled: true
- id: command-compact
  disabled: true
- id: tool-result-prune
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: workflow-workerthread
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true
- id: workspace-context
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-web
  disabled: true

